name: Auto Update MAL Streams

on:
  schedule:
    - cron: '0 */4 * * *'  # ഓരോ 4 മണിക്കൂറിലും തനിയെ റൺ ആകുന്നു
  workflow_dispatch:        # Actions ടാബിൽ കയറി നേരിട്ട് റൺ ചെയ്യാൻ

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write      # ഫയലുകൾ പുഷ് ചെയ്യാനുള്ള അനുമതി

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Builder Script
        run: |
          python build_streams.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add streams/ playlist.m3u
          git diff --staged --quiet || (git commit -m "Auto-update streams and tokens [skip ci]" && git push)
